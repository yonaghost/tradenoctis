name: Android CI

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/noctis-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctis-debug-apk
          path: android/app/build/outputs/apk/debug/noctis-debug.apk
          if-no-files-found: error

      - name: Publish/update "latest" APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: Noctis Android (build automático)
          body: |
            APK de depuração gerado automaticamente pelo CI a partir do commit ${{ github.sha }}.
            Este é o pacote usado pelo botão "Baixar aplicativo" do site.
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/noctis-debug.apk
